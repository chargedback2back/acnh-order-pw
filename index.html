<body>
<div class="title-wrapper">
  <img src="CE43BCB4-14C5-4210-ACD0-4E22AA281DC2_1_201_a-removebg-preview.png" alt="ACNH Icon" class="title-icon">
  <h1 class="title">ACNH Item<br>Order Builder</h1>
</div>
</div>
<button id="popup-btn" onclick="showPopup()"><span id="cart-badge">0</span></button>
<div id="popup">
<span id="popup-close" onclick="hidePopup()">✖</span><button id="popup-copy" onclick="copyToClipboard()" style="margin-bottom: 1em; font-weight: bold; background-color: #98c867; color: black; border: none; padding: 0.5em 1em; border-radius: 6px;">Copy</button>
<div id="popup-content"><strong>Selected Items:</strong><br/><hr/></div>
</div>
<div style="display: flex; align-items: center; gap: 8px;">
  <input id="search" placeholder="Search for items..." type="text" style="flex: 1;"/>
  <button id="clear-search" style="width: 40px; height: 40px; padding: 0; font-weight: bold; background-color: #E2826A; color: white; border: none; border-radius: 8px;">✕</button>
</div>
<div id="controls">
<button onclick="resetSelection()">Reset</button>
</div>
<div id="itemList"></div>
<script>
  const selectedItems = {};
  const cartBadge = document.getElementById('cart-badge');
const popupContent = document.getElementById('popup-content');
const popup = document.getElementById('popup');
    const searchInput = document.getElementById('search');
    const itemList = document.getElementById('itemList');
    const output = document.getElementById('output');

    async function renderList(filter = '') {
      const response = await fetch('final_parsed_animal_crossing_data.json');
      const data = await response.json();
      console.log("Fetched item data:", data);

      const items = {};
      // Also store image per item
      const itemImages = {};
      data.forEach(entry => {
        const name = entry["Named Variation"] || '';
        const longID = entry["Long ID"] || '';
        const image = entry["Image"] || '';
        if (name && longID) {
          items[name] = longID;
          itemImages[name] = image;
        }
      });

      itemList.innerHTML = '';
      Object.keys(items)
        .filter(name => name.toLowerCase().includes(filter.toLowerCase()))
        .forEach(name => {
          const longId = items[name];
          const isSelected = selectedItems.hasOwnProperty(longId);
          const qtyValue = selectedItems[longId] || 1;
          const image = itemImages[name] || '';

          const div = document.createElement('div');
          div.className = 'item';
          div.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
              <div style="flex-grow: 1;">
                <label>
                  <input type='checkbox' value='${longId}' ${isSelected ? 'checked' : ''}>
                  ${name}
                </label>
                <input type='number' min='1' value='${qtyValue}' class='quantity-input' style='${isSelected ? 'display:inline-block;' : 'display:none; margin-left: 8px; width: 50px;'}'>
              </div>
              <div style="flex-shrink: 0; margin-left: 12px;">
                <button class="view-image-btn" data-image="${image}" style="background: none; border: none; padding: 0; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;">
                  <img src="Camera.png" alt="View Image" style="width: 100%; height: 100%; object-fit: contain;">
                </button>
              </div>
            </div>
          `;

          const checkbox = div.querySelector('input[type="checkbox"]');
          const quantityInput = div.querySelector('.quantity-input');

          checkbox.addEventListener('change', () => {
            if (checkbox.checked) {
              quantityInput.style.display = 'inline-block';
              selectedItems[longId] = parseInt(quantityInput.value, 10) || 1;
            } else {
              quantityInput.style.display = 'none';
              delete selectedItems[longId];
            }
            updatePopupContent();
            updateCartBadge();
          });

          quantityInput.addEventListener('input', () => {
            if (checkbox.checked) {
              selectedItems[longId] = parseInt(quantityInput.value, 10) || 1;
              updatePopupContent();
              updateCartBadge();
            }
          });

          itemList.appendChild(div);

          // Add image button event listener
          const imageButton = div.querySelector('.view-image-btn');
          imageButton.addEventListener('click', () => {
            const modal = document.getElementById('image-modal');
            const img = document.getElementById('modal-image');
            img.src = imageButton.getAttribute('data-image');
            modal.style.display = 'flex';
          });
        });

      window.items = items; // Make globally available for updatePopupContent
      updatePopupContent();
    }

function updateCartBadge() {
  const cartBadge = document.getElementById('cart-badge');
  const totalQty = Object.values(selectedItems).reduce((sum, qty) => sum + qty, 0);

  if (totalQty > 0) {
    cartBadge.textContent = totalQty;
    cartBadge.style.display = 'inline-block';
  } else {
    cartBadge.textContent = '';
    cartBadge.style.display = 'none';
  }
}

function updatePopupContent() {
  if (!popupContent) return;

  console.log('📦 selectedItems:', JSON.stringify(selectedItems, null, 2));

  const selectedNames = [];
  const orderLines = [];

  const idToName = Object.entries(items).reduce((map, [name, id]) => {
    map[id] = name;
    return map;
  }, {});

  for (const [longId, quantity] of Object.entries(selectedItems)) {
    const name = idToName[longId];
    if (!name) {
      console.warn(`⚠️ No name found for ID ${longId}`);
      continue;
    }

    selectedNames.push(`${name} x${quantity}`);
    orderLines.push(...Array(quantity).fill(longId));
  }

  console.log('🧾 selectedNames:', selectedNames);
  console.log('📜 orderLines:', orderLines);

  popupContent.innerHTML = `
    <p><strong>Selected Items:</strong><br>${selectedNames.join('<br>')}</p>
    <p><strong>Command:</strong><br>$order ${orderLines.join(' ')}</p>
  `;

  window.currentOrderString = `$order ${orderLines.join(' ')}`;
}
function generateOrder() {
  const checked = document.querySelectorAll('input[type="checkbox"]:checked');
  const codes = Array.from(checked).map(cb => cb.value);
  output.textContent = codes.length > 0 ? `$order ${codes.join(' ')}` : 'No items selected.';
  output.scrollIntoView({ behavior: 'smooth' });
}

function copyToClipboard() {
  const contentEl = document.getElementById('popup-content');
  const rawText = contentEl.innerText;

  const orderIndex = rawText.indexOf('$order');
  const commandOnly = rawText.substring(orderIndex).replace(/\n/g, ' ').replace(/\s+/g, ' ').trim();

  const textarea = document.createElement('textarea');
  textarea.value = commandOnly;
  document.body.appendChild(textarea);
  textarea.select();
  document.execCommand('copy');
  document.body.removeChild(textarea);

  alert('Command copied to clipboard!');
}

function resetSelection() {
  searchInput.value = '';
  for (const id in selectedItems) {
    delete selectedItems[id];
  }
  renderList();
  updatePopupContent();
  updateCartBadge();
}

    searchInput.addEventListener('input', e => renderList(e.target.value));
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
    renderList();
    // Add clear search button handler
    document.getElementById('clear-search').addEventListener('click', () => {
      searchInput.value = '';
      renderList();
    });
  </script>
<script>
function showPopup() {
  updatePopupContent();
  updateCartBadge(); 
  popup.style.display = 'block';
}

function hidePopup() {
  document.getElementById('popup').style.display = 'none';
}
</script>
<div id="image-modal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background-color:rgba(0,0,0,0.8); z-index:9999; justify-content:center; align-items:center;">
  <div style="position:relative; width: 300px; height: 300px; background-image: url('shopping_background.png'); background-size: cover; border-radius: 25px; display: flex; justify-content: center; align-items: center; box-shadow: 0px 4px 10px rgba(0,0,0,0.4);">
    <!-- Exit Button -->
    <span onclick="document.getElementById('image-modal').style.display='none'" 
          style="position: absolute; top: 10px; right: 10px; font-size: 1.5rem; cursor: pointer; color: white; z-index: 10000;">✖</span>

    <!-- Main Image -->
    <img id="modal-image" src="" style="max-width: 80%; max-height: 80%; border-radius: 10px;" />
  </div>
</div>
<script>
function setupSwipeListeners() {
  document.querySelectorAll("li").forEach(item => {
    let touchstartX = 0;
    let touchendX = 0;

    item.addEventListener("touchstart", e => {
      touchstartX = e.changedTouches[0].screenX;
    });

    item.addEventListener("touchend", e => {
      touchendX = e.changedTouches[0].screenX;
      if (touchendX < touchstartX - 30) {
        const text = item.textContent.trim();
        if (text === "ABD (Green)") {
          const modal = document.getElementById("image-modal");
          const img = document.getElementById("modal-image");
          img.src = "https://acnhcdn.com/latest/FtrIcon/FtrATM_Remake_4_0.png";
          modal.style.display = "flex";
        }
      }
    });
  });
}

// Delay listener attachment to ensure elements exist
window.addEventListener("load", () => {
  setTimeout(setupSwipeListeners, 500);
});
</script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  updateCartBadge();
  document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', updateCartBadge);
  });
});
</script>
</body>
